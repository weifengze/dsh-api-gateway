name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Unit tests run against the built output in lib/, so they also guard the
      # shape the deployment actually loads.
      - run: pnpm test
      - name: Live acceptance (optional — only when a gateway is reachable)
        if: ${{ vars.DSH_AGW_BASE != '' }}
        env:
          DSH_AGW_BASE: ${{ vars.DSH_AGW_BASE }}
          DSH_AGW_KEY: ${{ secrets.DSH_AGW_KEY }}
        run: pnpm acceptance
