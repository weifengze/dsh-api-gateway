openapi: 3.0.3
info:
  title: dsh-api-gateway
  version: 0.3.0
  description: >
    Authenticated, fail-closed gateway over the DeepSeek Harness (0.1.5-rc.2)
    in-process Remote API. Unary calls and the answer channel are forwarded
    byte-for-byte into the host's shared /api Fetch handler; streams run over a
    multiplexed WebSocket mux. Wire envelopes belong to the host, not to this
    gateway: it only checks the endpoint name against a whitelist and never
    parses the RPC body.
servers:
  - url: http://127.0.0.1:3080/api-gw/v1
paths:
  /health:
    get:
      summary: Plugin status and host dispatch reachability
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, disabled] }
                  enabled: { type: boolean }
                  upstream: { type: string, enum: [ok, unreachable] }
                  apiKeySet: { type: boolean }
  /key:
    post:
      summary: One-time key bootstrap (only while no key exists at all)
      security: []
      responses:
        '200':
          description: key minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey: { type: string }
                  persisted: { type: boolean }
        '403':
          description: already provisioned or provisioning disabled
  /admin/enable:
    post:
      summary: Runtime master switch (X-Admin-Key)
      responses:
        '200': { description: toggled }
        '401': { description: admin_unauthorized }
  /admin/rotate-key:
    post:
      summary: Rotate the provisioned key (X-Admin-Key)
      responses:
        '200':
          description: new key
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey: { type: string }
                  persisted: { type: boolean }
  /proxy/{namespace}/{method}:
    post:
      summary: Unary Remote dispatch through the host shared /api handler
      description: >
        Body and response are the host envelopes verbatim:

        request `{ "type": "client-request", "rpcId": "...",
        "method": "<namespace>/<method>", "payload": { "args": { ... } } }`;

        response `{ "type": "server-response", "rpcId": "...",
        "result": { "ok": true, "value": ... } }` or
        `{ "type": "server-response", "rpcId": "...",
        "result": { "ok": false, "error": { "code", "message", "details" } } }`.

        Argument names come from the host descriptor (`request`, `_request`,
        or none). The gateway only enforces the whitelist.
      parameters:
        - name: namespace
          in: path
          required: true
          schema: { type: string }
        - name: method
          in: path
          required: true
          schema: { type: string }
          description: >
            Whitelisted endpoints: session/list, session/create, session/page,
            session/prompt, session/cancel, session/rename, session/fork,
            session/updateQueue, session/attachment, session/modelCatalog,
            session/selectModel, $events/result.
      security:
        - ApiKey: []
        - BearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: host server-response envelope, verbatim }
        '401': { description: unauthorized }
        '403': { description: method_not_allowed (whitelist) }
        '502': { description: host_unavailable (connection service missing) }
  /sessions/{id}/sandbox-mode:
    post:
      summary: >
        Per-session sandbox override (read-only | workspace-write). Pins a
        sandbox/mode override event onto a live session; durable across cold
        wake (log replay). danger-full-access is not grantable over the wire.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Session id (must be live/attached)
      security:
        - ApiKey: []
        - BearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [read-only, workspace-write] }
      responses:
        '200':
          description: override written
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string }
                  mode: { type: string }
        '400': { description: bad_json / invalid_mode }
        '401': { description: unauthorized }
        '409': { description: session_not_live (cold or unknown session) }
        '501': { description: service_unavailable (host session store missing) }
  /events.mux:
    get:
      summary: >
        Remote stream mux (WebSocket upgrade; X-API-Key in the upgrade
        headers). One socket multiplexes logical streams.
      description: >
        Client frames: `{ "type": "open", "streamId", "endpoint", "payload" }`
        and `{ "type": "cancel", "streamId" }`.
        Host frames: `{ "type": "item", "streamId", "value" }`,
        `{ "type": "error", "streamId", "error" }`,
        `{ "type": "end", "streamId" }`.

        Whitelisted stream endpoints: `$events` (forwarded approvals and user
        questions; payload `{ "args": {} }`), `session/follow`,
        `session/control`. Answers to `$events` waterfall frames go through
        `POST /proxy/$events/result`.

        The server pings every 2 seconds and terminates the socket after two
        missed pongs. Also registered at `/proxy/events.mux` so clients whose
        base is the proxy prefix derive the mux URL uniformly.
      security:
        - ApiKey: []
        - BearerKey: []
      responses:
        '101': { description: Switching Protocols; item/error/end frames follow }
        '401': { description: upgrade refused before protocol negotiation }
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    BearerKey:
      type: http
      scheme: bearer
